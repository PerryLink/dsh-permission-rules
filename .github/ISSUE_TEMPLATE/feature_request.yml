name: Feature request
description: Suggest an enhancement for dsh-permission-rules
title: "[feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Describe the problem first — the best features start from a concrete gap.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What you cannot express or do today with the rule vocabulary, matching, audit, or commands.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: How the plugin should behave once the feature exists (example rules or command output welcome).
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered (optional)
      description: Workarounds you use today, or alternative designs you rejected.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context (optional)
      description: Anything else: policy needs, host versions, links to related issues.
    validations:
      required: false
