# dsh-permission-rules bundle patch: mount the declarative permission-rule
# listener. `name` is the package name, resolved through the profile's
# node_modules. An id-targeted override replaces the whole config row —
# restate every key when overriding. Full schema and config vocabulary:
# README.md and docs/rules-format.schema.json.
- insert:
    - id: permission-rules
      name: dsh-permission-rules
      config:
        # Rule file discovered per session cwd (<cwd>/.dsh/rules.yaml);
        # see docs/rules-format.md for the full rule vocabulary.
        rulesFile: .dsh/rules.yaml
        badFilePolicy: fail
        maxRules: 256
        patternMode: glob
        watch: true
        # allowUnmarkedAudit: false   # hosts that predate the ignorable marker
        #                             # degrade to audit-off by default (safe);
        #                             # set true to keep the in-session trail
